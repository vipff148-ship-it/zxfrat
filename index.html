<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZXFRAT Photo Share</title>
<style>
body{font-family:system-ui,sans-serif;background:#0b1020;color:#fff;margin:0;padding:24px}
.card{max-width:560px;margin:auto;background:#151c33;border-radius:20px;padding:22px;box-shadow:0 15px 45px #0006}
button{width:100%;padding:14px;margin-top:10px;border:0;border-radius:12px;font-weight:700}
#preview{width:100%;margin-top:15px;border-radius:14px;display:none}
.muted{color:#aeb8d4;font-size:14px}
#status{margin-top:14px}
</style>
</head>
<body>
<div class="card">
<h2>📷 ZXFRAT Photo Share</h2>
<p class="muted">Ambil foto secara sadar. Foto hanya dikirim setelah kamu menekan tombol <b>KIRIM FOTO</b>.</p>
<input id="camera" type="file" accept="image/*" capture="environment" style="display:none">
<button id="take">AMBIL FOTO</button>
<img id="preview" alt="Preview foto">
<button id="send" disabled>KIRIM FOTO</button>
<div id="status"></div>
</div>
<script>
const camera=document.getElementById('camera');
const preview=document.getElementById('preview');
const take=document.getElementById('take');
const send=document.getElementById('send');
const status=document.getElementById('status');
let file=null;

take.onclick=()=>camera.click();

camera.onchange=()=>{
  file=camera.files && camera.files[0];
  if(!file){return;}
  preview.src=URL.createObjectURL(file);
  preview.style.display='block';
  send.disabled=false;
  status.textContent='Foto siap dikirim. Tekan KIRIM FOTO.';
};

send.onclick=async()=>{
  if(!file)return;
  send.disabled=true;
  status.textContent='Siap diintegrasikan dengan Firebase Storage.';
  // Intentionally no automatic upload here: configure your Firebase project
  // and perform upload only after explicit user consent.
};
</script>
</body>
</html>
